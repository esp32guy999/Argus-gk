# Argus monitoring — scrapes localhost (co-located on anvil; no cross-host routing).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: argus
    metrics_path: /metrics/        # ui/server.py mounts make_asgi_app at /metrics (bare 307s)
    static_configs:
      - targets: ['localhost:8210']

  - job_name: llama-swap
    metrics_path: /metrics
    static_configs:
      - targets: ['localhost:9090']

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9091']
