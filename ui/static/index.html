<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Desktop">
  <meta name="theme-color" content="#0a0a0f">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <link rel="stylesheet" href="/static/styles.css?v=40">
  <title>Claude Desktop Next</title>
</head>
<body>
  <!-- ── Side Nav (fixed left, icon-only) ─────────────────────────── -->
  <nav id="side-nav">
    <button class="nav-tab active" data-view="chat" title="Chat">
      <svg viewBox="0 0 24 24"><path class="ico" d="M6 4 H18 A3 3 0 0 1 21 7 V13 A3 3 0 0 1 18 16 H11 L7 19 V16 H6 A3 3 0 0 1 3 13 V7 A3 3 0 0 1 6 4 Z"/><circle class="eye" cx="12" cy="9.5" r="2.1"/></svg>
      <span>Chat</span>
    </button>
    <button class="nav-tab" data-view="canvas" title="Canvas">
      <svg viewBox="0 0 24 24"><rect class="ico" x="3" y="4" width="8.4" height="7" rx="1.7"/><rect class="eye" x="13" y="4" width="8" height="5" rx="1.6"/><rect class="ico" x="3" y="13" width="8.4" height="7" rx="1.7"/><rect class="ico" x="13" y="11" width="8" height="9" rx="1.7"/></svg>
      <span>Canvas</span>
    </button>
    <button class="nav-tab" data-view="briefing" title="Briefing">
      <svg viewBox="0 0 24 24"><rect class="ico" x="4" y="3" width="16" height="18" rx="2.6"/><rect class="eye" x="7.5" y="7" width="9" height="2.2" rx="1.1"/><path class="ico" d="M7.5 12.5 H16.5 M7.5 15.5 H14"/></svg>
      <span>Brief</span>
    </button>
    <button class="nav-tab" data-view="gpu" title="GPU">
      <svg viewBox="0 0 24 24"><rect class="ico" x="6" y="6" width="12" height="12" rx="2.6"/><rect class="eye" x="9.6" y="9.6" width="4.8" height="4.8" rx="1.1"/><path class="ico" d="M9 6 V3 M12 6 V3 M15 6 V3 M9 18 V21 M12 18 V21 M15 18 V21 M6 9 H3 M6 12 H3 M6 15 H3 M18 9 H21 M18 12 H21 M18 15 H21"/></svg>
      <span>GPU</span>
    </button>
    <button class="nav-tab" data-view="network" title="Network">
      <svg viewBox="0 0 24 24"><path class="ico" d="M10.3 10.3 L6.4 6.4 M13.7 10.3 L17.6 6.4 M10.3 13.7 L6.4 17.6 M13.7 13.7 L17.6 17.6"/><circle class="ico" cx="5" cy="5" r="1.9"/><circle class="ico" cx="19" cy="5" r="1.9"/><circle class="ico" cx="5" cy="19" r="1.9"/><circle class="ico" cx="19" cy="19" r="1.9"/><circle class="eye" cx="12" cy="12" r="2.7"/></svg>
      <span>Net</span>
    </button>
    <div class="nav-spacer"></div>
    <button class="nav-tab" id="nav-tools" title="Tools">
      <svg viewBox="0 0 24 24"><circle class="ico" cx="12" cy="12" r="5"/><circle class="eye" cx="12" cy="12" r="2"/><path class="ico" d="M12 7 V5 M12 17 V19 M7 12 H5 M17 12 H19 M8.5 8.5 L7.1 7.1 M15.5 8.5 L16.9 7.1 M8.5 15.5 L7.1 16.9 M15.5 15.5 L16.9 16.9"/></svg>
      <span>Tools</span>
    </button>
    <button class="nav-tab" id="nav-convs" title="Conversations">
      <svg viewBox="0 0 24 24"><rect class="ico" x="3" y="4" width="18" height="13" rx="3"/><path class="ico" d="M8 17 V20 L11 17"/><rect class="eye" x="7" y="7.4" width="7" height="2" rx="1"/><path class="ico" d="M7 11.4 H17 M7 14 H15"/></svg>
      <span>Convos</span>
    </button>
    <button class="nav-tab" id="nav-theme" title="Switch theme">
      <svg viewBox="0 0 24 24"><circle class="ico" cx="12" cy="12" r="7.5"/><path class="eye" d="M12 4.5 A7.5 7.5 0 0 1 12 19.5 Z"/></svg>
      <span id="nav-theme-label">Theme</span>
    </button>
  </nav>

  <!-- ── Nav backdrop (mobile drawer) ────────────────────────────── -->
  <div id="nav-backdrop"></div>

  <!-- ── Top Bar ──────────────────────────────────────────────────── -->
  <header id="top-bar">
    <button id="side-toggle" class="btn-icon" title="Toggle side nav">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <select id="model-select"><option>Loading…</option></select>
    <span id="model-warm" class="model-warm" hidden></span>
    <span class="flex-spacer"></span>
    <!-- theme toggle moved to conv-drawer -->
    <span id="brain-status" class="brain-dot" title="Central Brain"></span>
  </header>

  <!-- ── Main content area ───────────────────────────────────────── -->
  <main id="main">

    <!-- Chat view -->
    <section class="view active" id="view-chat">
      <div id="chat-messages"></div>
      <button class="scroll-pill" id="scroll-pill">↓ New messages</button>
      <div id="chat-input-area">
        <div id="chat-attach" title="Attach files (or paste / drag)" style="cursor:pointer;position:relative;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
          <input type="file" id="chat-attach-input" multiple accept="image/*,.pdf,.txt,.md,.json,.csv,.log,.py,.js,.ts,.html,.css" style="position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;cursor:pointer;">
        </div>
        <textarea id="chat-input" placeholder="" rows="1"></textarea>
        <button id="chat-send" title="Send">
          <svg class="send-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
          <svg class="stop-icon hidden" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
        </button>
      </div>
    </section>

    <!-- Canvas view — widget panels live here -->
    <section class="view" id="view-canvas">
      <div id="canvas-body"></div>
      <div id="canvas-tabbar">
        <button class="add-widget-btn" id="add-widget-btn">+ Widget</button>
      </div>
    </section>

    <!-- Briefing view -->
    <section class="view" id="view-briefing">
      <div class="view-header">
        <h2>Morning Briefing</h2>
        <button id="briefing-refresh" class="btn-icon" title="Refresh">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        </button>
      </div>
      <div id="briefing-body"><div class="briefing-placeholder">Loading briefing…</div></div>
    </section>

    <!-- GPU view -->
    <section class="view" id="view-gpu">
      <div class="view-header"><h2>GPU Cockpit</h2>
        <button id="gpu-refresh" class="btn-icon" title="Refresh">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        </button>
      </div>
      <div id="gpu-stats">
        <div class="stat-card"><span class="stat-label">Temperature</span><span class="stat-value" id="gpu-temp">—</span></div>
        <div class="stat-card"><span class="stat-label">Utilization</span><span class="stat-value" id="gpu-util">—</span></div>
        <div class="stat-card"><span class="stat-label">VRAM</span>
          <div class="bar-container"><div class="bar-fill" id="gpu-vram-bar"></div></div>
          <span class="stat-detail" id="gpu-vram-text">— / — MB</span>
        </div>
        <div class="stat-card"><span class="stat-label">Power</span>
          <div class="bar-container"><div class="bar-fill power" id="gpu-power-bar"></div></div>
          <span class="stat-detail" id="gpu-power-text">— / — W</span>
        </div>
      </div>
      <div class="panel">
        <h3>Loaded models</h3>
        <div id="model-list">—</div>
      </div>
    </section>

    <!-- Network view -->
    <section class="view" id="view-network">
      <div class="view-header"><h2>Network Pulse</h2>
        <button id="pulse-refresh" class="btn-icon" title="Refresh">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        </button>
      </div>
      <div id="machine-grid">Loading…</div>
    </section>
  </main>

  <!-- ── Tools Overlay ───────────────────────────────────────────── -->
  <div id="tools-overlay" class="calc-overlay hidden">
    <div class="calc-header">
      <h2>Tools</h2>
      <button class="btn-icon" data-close="tools-overlay">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="tools-grid">
      <div class="tools-section-label">Conversation</div>
      <button class="tools-card" data-action="new-chat">
        <span class="tools-card-icon">+</span>
        <span class="tools-card-label">New chat</span>
        <span class="tools-card-desc">Start a fresh conversation</span>
      </button>
      <button class="tools-card" data-action="open-convs">
        <span class="tools-card-icon">#</span>
        <span class="tools-card-label">Conversations</span>
        <span class="tools-card-desc">Browse saved threads</span>
      </button>
      <button class="tools-card" data-action="clear-history">
        <span class="tools-card-icon">!</span>
        <span class="tools-card-label">Clear history</span>
        <span class="tools-card-desc">Wipe all stored messages</span>
      </button>

      <div class="tools-section-label">Canvas</div>
      <button class="tools-card" data-action="save-layout">
        <span class="tools-card-icon">S</span>
        <span class="tools-card-label">Save layout</span>
        <span class="tools-card-desc">Name this panel arrangement</span>
      </button>
      <button class="tools-card" data-action="load-layout">
        <span class="tools-card-icon">L</span>
        <span class="tools-card-label">Load layout</span>
        <span class="tools-card-desc">Restore a saved preset</span>
      </button>
      <button class="tools-card" data-action="add-widget">
        <span class="tools-card-icon">+</span>
        <span class="tools-card-label">Add widget</span>
        <span class="tools-card-desc">Pick from the registry</span>
      </button>

      <div class="tools-section-label">Media</div>
      <button class="tools-card" data-action="open-audiobooks">
        <span class="tools-card-icon">🎧</span>
        <span class="tools-card-label">Audiobooks</span>
        <span class="tools-card-desc">Search AudiobookBay & one-tap grab</span>
      </button>

      <div class="tools-section-label">Brain</div>
      <button class="tools-card" data-action="memory-browser">
        <span class="tools-card-icon">M</span>
        <span class="tools-card-label">Memory browser</span>
        <span class="tools-card-desc">Inspect stored memories</span>
      </button>
      <button class="tools-card" data-action="nec-prefix">
        <span class="tools-card-icon">E</span>
        <span class="tools-card-label">/nec prefix</span>
        <span class="tools-card-desc">Send an NEC code lookup</span>
      </button>
    </div>
  </div>

  <!-- ── Conversation Drawer ─────────────────────────────────────── -->
  <div id="conv-drawer" class="hidden">
    <div id="conv-drawer-backdrop"></div>
    <div id="conv-drawer-panel">
      <div id="conv-drawer-header">
        <h3>Conversations</h3>
        <button id="conv-close" class="btn-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M18 6L6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <button id="conv-new" class="btn-primary" style="width:100%;margin-bottom:12px;">+ New Chat</button>
      <div id="conv-list"></div>
      <div id="conv-links" style="margin-top:16px;padding-top:12px;border-top:1px solid rgba(255,255,255,.08);">
        <div style="font-size:11px;letter-spacing:1px;color:#8f8a7c;margin-bottom:8px;">LINKS</div>
        <a href="http://anvil:8224" target="_blank" rel="noopener"
           style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;text-decoration:none;
                  color:inherit;background:rgba(232,182,76,.10);border:1px solid rgba(232,182,76,.25);">
          <span style="font-size:20px;">📻</span>
          <span style="display:flex;flex-direction:column;line-height:1.25;">
            <span style="font-weight:600;">Classic AT40</span>
            <span style="font-size:12px;color:#8f8a7c;">Casey Kasem · live</span>
          </span>
        </a>
      </div>
    </div>
  </div>

  <!-- ── Widget Picker Overlay ───────────────────────────────────── -->
  <div id="widget-picker-overlay" class="calc-overlay hidden">
    <div class="calc-header">
      <h2>Add widget</h2>
      <button class="btn-icon" data-close="widget-picker-overlay">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="tools-grid" id="widget-type-list"></div>
  </div>

  <!-- ── Presets Overlay ─────────────────────────────────────────── -->
  <div id="presets-overlay" class="calc-overlay hidden">
    <div class="calc-header">
      <h2 id="presets-title">Load layout</h2>
      <button class="btn-icon" data-close="presets-overlay">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="tools-grid" id="presets-list"></div>
  </div>

  <!-- ── Memory Modal ────────────────────────────────────────────── -->
  <div id="memory-overlay" class="calc-overlay hidden">
    <div class="calc-header">
      <h2>Memories</h2>
      <button class="btn-icon" data-close="memory-overlay">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div id="memory-body" class="tools-grid"></div>
  </div>

  <!-- ── Widget scripts ──────────────────────────────────────────── -->
  <script src="/static/widgets/registry.js?v=1"></script>
  <script src="/static/widgets/system.js?v=2"></script>
  <script src="/static/widgets/ha.js?v=1"></script>
  <script src="/static/widgets/docs.js?v=2"></script>
  <script src="/static/widgets/search.js?v=1"></script>
  <script src="/static/widgets/web.js?v=1"></script>
  <script src="/static/widgets/storage.js?v=1"></script>
  <script src="/static/widgets/torrents.js?v=1"></script>
  <script src="/static/widgets/audiobook.js?v=2"></script>
  <script src="/static/widgets/weather.js?v=1"></script>
  <script src="/static/widgets/generated.js?v=1"></script>
  <script src="/static/widgets/relogin.js?v=1"></script>
  <!-- DISABLED 2026-05-25 — kills iOS Safari (black screen). See https://github.com/esp32guy999/claude-desktop-next   <script src="/static/widgets/ccpair.js?v=1"></script> -->
  <script src="/static/app.js?v=49"></script>
</body>
</html>
